[package]
name = "rtmp-forwarder"
version = "0.1.0"
edition = "2024"
authors = ["nanpuyue <nanpuyue@gmail.com>"]
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
mpeg2ts = "0.6.1"
rand = "0.10.2"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["codec", "io-util"] }
tower-http = { version = "0.7.0", features = ["cors", "auth"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["socket", "net"] }
